<!DOCTYPE html>
<html>
<head>
<title>Laravel - API test example</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.4.1/jquery.min.js" crossorigin="anonymous"></script>
</head>
<body>
    <h2>Products API V3 Test</h2>
    <div id="infoProducts"></div>

    <hr>
    <h2>Create New Product (POST Test)</h2>
    <form id="createProductForm">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required><br><br>
        
        <label for="price">Price:</label>
        <input type="number" id="price" name="price" required><br><br>
        
        <button type="submit">Create Product</button>
    </form>
    <div id="createResult"></div>

    <script type="text/javascript">
        // GET Request
        $.ajax({
            type: "GET",
            dataType: "json",
            url: 'http://127.0.0.1:8000/api/v3/products',
            success: function(data){
                $('#infoProducts').html(JSON.stringify(data));
            }
        });

        // POST Request handler
        $('#createProductForm').submit(function(e) {
            e.preventDefault();
            
            const name = $('#name').val();
            const price = $('#price').val();
            
            $.ajax({
                type: "POST",
                dataType: "json",
                url: 'http://127.0.0.1:8000/api/v3/products',
                data: {
                    name: name,
                    price: price
                },
                success: function(data){
                    $('#createResult').html('<p style="color: green;">Success: ' + JSON.stringify(data) + '</p>');
                    // Refresh GET request
                    $.ajax({
                        type: "GET",
                        dataType: "json",
                        url: 'http://127.0.0.1:8000/api/v3/products',
                        success: function(data){
                            $('#infoProducts').html(JSON.stringify(data));
                        }
                    });
                },
                error: function(xhr) {
                    $('#createResult').html('<p style="color: red;">Error: ' + xhr.responseText + '</p>');
                }
            });
        });
    </script>
</body>
</html>
